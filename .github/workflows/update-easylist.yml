name: Update EasyList Daily

on:
  schedule:
    - cron: "0 23 * * *"  # 每天 UTC 23:00 运行
  workflow_dispatch:  # 支持手动触发

jobs:
  update-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}  # 使用 PAT_TOKEN 允许触发后续的 workflow 并拥有推送权限

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EasyList update script
        run: python update_easylist.py

      - name: Run Blacklist update script
        run: python update_blacklist_config.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: |
            modified_easylist.txt
            optimized_blacklist.conf
          name: Latest EasyList Update
          body: Automated daily update of EasyList and Blacklist config.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
