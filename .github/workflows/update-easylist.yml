name: Update EasyList Daily

on:
  schedule:
    - cron: "7 23 * * *"  # 每天 UTC 23:07 运行
  workflow_dispatch:  # 支持手动触发

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用 GITHUB_TOKEN 提高安全性

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EasyList update script
        run: python update_easylist.py

      - name: Validate EasyList output
        run: |
          set -e
          if [ ! -f modified_easylist.txt ]; then
            echo "❌ modified_easylist.txt not found!"
            exit 1
          fi
          if ! grep -q "\[Adblock Plus" modified_easylist.txt; then
            echo "❌ Invalid EasyList format!"
            exit 1
          fi
          echo "✅ EasyList validation passed"

      - name: Run Blacklist update script
        run: python update_blacklist_config.py

      - name: Validate Blacklist output
        run: |
          set -e
          if [ ! -f optimized_blacklist.conf ]; then
            echo "❌ optimized_blacklist.conf not found!"
            exit 1
          fi
          echo "✅ Blacklist validation passed"

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: |
            modified_easylist.txt
            optimized_blacklist.conf
          name: Latest EasyList Update
          body: Automated daily update of EasyList and Blacklist config.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
